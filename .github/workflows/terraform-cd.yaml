name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'envs/shared/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment name under envs/shared
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  discover:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path("envs/shared")
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              names = {os.environ["REQUESTED_ENVIRONMENT"]}
          else:
              before = os.environ["BEFORE_SHA"]
              current = os.environ["CURRENT_SHA"]
              if set(before) == {"0"}:
                  command = ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", current]
              else:
                  command = ["git", "diff", "--name-only", before, current]
              changed = subprocess.check_output(command, text=True).splitlines()
              names = {
                  pathlib.PurePosixPath(path).parts[2]
                  for path in changed
                  if pathlib.PurePosixPath(path).parts[:2] == ("envs", "shared")
                  and len(pathlib.PurePosixPath(path).parts) >= 3
              }

          environments = []
          for name in sorted(names):
              directory = root / name
              if "/" in name or name in {"", ".", ".."}:
                  raise SystemExit(f"Invalid environment name: {name!r}")
              if not (directory / "main.tf").is_file():
                  continue
              if (directory / "backend.tf").is_file():
                  print(
                      f"Skipping {directory}: remote-state environments are owned by Argo Workflows",
                      file=os.sys.stderr,
                  )
                  continue
              environments.append(str(directory))

          print("matrix=" + json.dumps(environments))
          PY

  deploy:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init

      - run: terraform apply -auto-approve

      - name: Sync State Back to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.tfstate
          git diff --quiet && git diff --staged --quiet || (git commit -m "update state for ${GITHUB_SHA::7} [skip ci]" && git pull --rebase && git push)
